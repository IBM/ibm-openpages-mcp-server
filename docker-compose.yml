version: '3.8'

# Docker Compose automatically reads .env file from the same directory
# Variables defined in .env will be used for ${VAR_NAME} substitutions below

services:
  grc-mcp-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      # These values come from .env file in root directory
      # Default values (after :-) are used if not set in .env
      - OPENPAGES_BASE_URL=${OPENPAGES_BASE_URL:-https://openpages-server.example.com}
      - OPENPAGES_USERNAME=${OPENPAGES_USERNAME:-admin}
      - OPENPAGES_PASSWORD=${OPENPAGES_PASSWORD:-password}
      - DEBUG=${DEBUG:-False}
      - SSL_VERIFY=${SSL_VERIFY:-True}
    restart: unless-stopped
    # Comment out volume mount if using podman and having path issues
    # volumes:
    #   - .:/app
    # Uses CMD from Dockerfile: python main.py --mode remote
    networks:
      - mcp-network

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - grc-mcp-server
    networks:
      - mcp-network
    profiles:
      - with-proxy

networks:
  mcp-network:
    driver: bridge

